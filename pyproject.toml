[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflows"
version = "0.1.0"
description = "Agent extensions and supervised workflows for maintaining GitHub repositories"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
agent-workflows = "github_workflows.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "B", "C4", "E", "F", "I", "PIE", "PT", "RUF", "UP", "W",
]
ignore = ["E501", "UP022"]

[tool.ruff.lint.isort]
known-first-party = ["github_workflows"]

[tool.ruff.lint.per-file-ignores]
"src/github_workflows/*.py" = ["B904"]

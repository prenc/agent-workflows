[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflows"
version = "0.1.0"
description = "Agent extensions and supervised workflows for maintaining GitHub repositories"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
agent-workflows = "github_workflows.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "A",       # flake8-builtins
    "ASYNC",   # flake8-async
    "B",       # flake8-bugbear
    "BLE",     # flake8-blind-except
    "C4",      # flake8-comprehensions
    "DTZ",     # flake8-datetimez
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "G",       # flake8-logging-format
    "I",       # isort
    "LOG",     # flake8-logging
    "N",       # pep8-naming
    "PGH",     # pygrep-hooks
    "PIE",     # flake8-pie
    "PLE",     # pylint errors
    "PLW1510", # subprocess.run without check
    "PT",      # flake8-pytest-style
    "RUF",     # Ruff-specific rules
    "S",       # flake8-bandit
    "TRY400",  # error-instead-of-exception
    "UP",      # pyupgrade
    "W",       # pycodestyle warnings
]
ignore = [
    "E501",
    "S603", # subprocess execution is a core, separately validated workflow capability
    "S607", # workflow tools intentionally resolve trusted executables from PATH
    "UP022",
]

[tool.ruff.lint.isort]
known-first-party = ["github_workflows"]

[tool.ruff.lint.per-file-ignores]
"extensions/github-workflows/hooks/*.py" = ["S101", "S105"]
"src/github_workflows/*.py" = ["B904"]
"src/github_workflows/github_cache.py" = ["S108", "S606"]
"tests/**/*.py" = ["ASYNC240", "S101", "S108"]

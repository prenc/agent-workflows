interface:
  display_name: "Pick Up GitHub Work"
  short_description: "Assess or complete GitHub work"
  default_prompt: "Use $gh-pickup-work to assess current issue and pull-request state before either completing one cohesive implementation unit or, with --assess-only, publishing only actionable managed evidence and lifecycle status."
dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub issues and pull requests"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/"
policy:
  allow_implicit_invocation: true

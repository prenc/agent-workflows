interface:
  display_name: "Reassess GitHub Work"
  short_description: "Recheck issue and pull-request work"
  default_prompt: "Use $gh-reassess-work to reassess issue or pull-request work and update its managed evidence."
dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub issues and pull requests"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/"
policy:
  allow_implicit_invocation: true

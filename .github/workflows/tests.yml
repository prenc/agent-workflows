name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.12", "3.13", "3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv venv --python "${{ matrix.python-version }}"
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Enable audit namespace isolation
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount --net true
      - run: uv run pytest -q --tb=line

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - run: uv run pre-commit run --all-files

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - name: Smoke-test built wheel
        run: |
          uv venv --python 3.12 "${RUNNER_TEMP}/package-smoke"
          uv pip install --python "${RUNNER_TEMP}/package-smoke/bin/python" dist/*.whl
          "${RUNNER_TEMP}/package-smoke/bin/agent-workflows" --help
